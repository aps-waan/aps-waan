<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan to Electric Indigo Gradient -->
    <linearGradient id="cyanIndigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#38bdf8;#818cf8;#22d3ee" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#22d3ee;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#22d3ee;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="glassBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.45)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.3)" />
    </linearGradient>

    <!-- Moving Radar Beam Gradient -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0)" />
      <stop offset="80%" stop-color="rgba(6, 182, 212, 0.08)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.25)" />
    </linearGradient>

    <!-- Cyberpunk Tech Grid -->
    <pattern id="techGridDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.028)" stroke-width="1" />
      <circle cx="30" cy="30" r="0.75" fill="rgba(56, 189, 248, 0.3)" />
    </pattern>

    <!-- Filters -->
    <filter id="cyanGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ambientDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
    
    @keyframes pulseBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }
    @keyframes shimmerBarWidth {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.6)); }
    }
    
    .pulse {
      animation: pulseBeacon 2.5s infinite ease-in-out;
      transform-origin: center;
    }
    .scanline {
      animation: scanlineAnim 7s infinite linear;
    }
    .glow-bar {
      animation: shimmerBarWidth 3s infinite ease-in-out;
    }
    @keyframes waveAnim {
      0% { stroke-dashoffset: 432; opacity: 0.3; }
      50% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes cycle1 { 0%, 28% { opacity: 1; } 33%, 95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes cycle2 { 0%, 28% { opacity: 0; } 33%, 61% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes cycle3 { 0%, 61% { opacity: 0; } 66%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blinkC { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .wave-pulse { animation: waveAnim 3.5s infinite linear; }
    .cmd-1 { animation: cycle1 9s infinite; }
    .cmd-2 { animation: cycle2 9s infinite; }
    .cmd-3 { animation: cycle3 9s infinite; }
    .cursor-blink { animation: blinkC 0.8s infinite; }
  </style>

  <!-- Container Base -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGradDark)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="110" r="160" fill="#0284c7" opacity="0.18" filter="url(#ambientDark)" />
  <circle cx="1060" cy="270" r="190" fill="#6366f1" opacity="0.18" filter="url(#ambientDark)" />
  <circle cx="640" cy="50" r="130" fill="#06b6d4" opacity="0.12" filter="url(#ambientDark)" />

  <!-- Grid Matrix -->
  <rect width="1200" height="380" rx="14" fill="url(#techGridDark)" />

  <!-- Animated Radar Scanline -->
  <g class="scanline">
    <rect x="0" y="0" width="1200" height="70" fill="url(#radarBeam)" opacity="0.6" />
    <line x1="0" y1="70" x2="1200" y2="70" stroke="rgba(34, 211, 238, 0.6)" stroke-width="1" />
  </g>

  <!-- Corner Precision Reticles -->
  <path d="M 18 32 L 18 18 L 32 18" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none" />
  <path d="M 1182 32 L 1182 18 L 1168 18" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none" />
  <path d="M 18 348 L 18 362 L 32 362" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none" />
  <path d="M 1182 348 L 1182 362 L 1168 362" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none" />

  <!-- Top System Telemetry Strip -->
  <g transform="translate(48, 24)">
    <circle cx="4" cy="4" r="3.5" fill="#10b981" class="pulse" filter="url(#softGlowDark)" />
    <text x="16" y="7.5" fill="#64748b" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="1.5">SYS_STATUS: ONLINE</text>
    <text x="170" y="7.5" fill="#334155" class="font-mono" font-size="9.5">•</text>
    <text x="185" y="7.5" fill="#64748b" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="1.5">CHITKARA UNIV // BBA FINTECH</text>
    <text x="405" y="7.5" fill="#334155" class="font-mono" font-size="9.5">•</text>
    <text x="420" y="7.5" fill="#38bdf8" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="1.5">APS-WAAN.VERCEL.APP</text>
  </g>

  <!-- ================= LEFT COLUMN: HERO IDENTITY ================= -->
  <g transform="translate(48, 62)">
    
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="270" height="24" rx="12" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#22d3ee" class="pulse" />
      <text x="24" y="15.5" fill="#7dd3fc" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="1.5">DATA &amp; BI ANALYST // FINTECH</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="68" fill="#f8fafc" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.8">
      Agampreet Singh Waan
    </text>

    <!-- Dynamic Animated Gradient Sub-Headline -->
    <text x="0" y="104" fill="url(#cyanIndigoGrad)" class="font-sans" font-size="18" font-weight="700" letter-spacing="0.3">
      Business Intelligence • FinTech Systems • Commercial Web
    </text>

    <!-- Clear Value Proposition Copy -->
    <text x="0" y="136" fill="#94a3b8" class="font-sans" font-size="14" font-weight="400" letter-spacing="0.1">
      Engineering data products, relational SQL pipelines, and Power BI dashboards
    </text>
    <text x="0" y="157" fill="#94a3b8" class="font-sans" font-size="14" font-weight="400" letter-spacing="0.1">
      alongside live commercial client web storefronts (Shopify, WordPress &amp; React).
    </text>

    <!-- ================= SPEC PILLS ROW 1 ================= -->
    <g transform="translate(0, 192)">
      <!-- Pill 1: SQL & BI -->
      <g transform="translate(0, 0)">
        <rect width="175" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="url(#glassBorderDark)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
        <text x="28" y="20" fill="#e2e8f0" class="font-mono" font-size="10.5" font-weight="600">SQL &amp; Power BI / DAX</text>
      </g>

      <!-- Pill 2: FinTech & Risk -->
      <g transform="translate(187, 0)">
        <rect width="180" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="url(#glassBorderDark)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#fbbf24" />
        <text x="28" y="20" fill="#e2e8f0" class="font-mono" font-size="10.5" font-weight="600">Quant Risk &amp; Sharpe/VaR</text>
      </g>

      <!-- Pill 3: E-Commerce Storefronts -->
      <g transform="translate(379, 0)">
        <rect width="188" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="url(#glassBorderDark)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#34d399" />
        <text x="28" y="20" fill="#e2e8f0" class="font-mono" font-size="10.5" font-weight="600">Shopify • WP • React SPAs</text>
      </g>
    </g>

    <!-- ================= SPEC PILLS ROW 2 ================= -->
    <g transform="translate(0, 234)">
      <!-- Pill 4: AI & Machine Intelligence -->
      <g transform="translate(0, 0)">
        <rect width="205" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="url(#glassBorderDark)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#a78bfa" />
        <text x="28" y="20" fill="#e2e8f0" class="font-mono" font-size="10.5" font-weight="600">AI Agents &amp; ML Data Cleaners</text>
      </g>

      <!-- Pill 5: Cloud & Web Ops -->
      <g transform="translate(217, 0)">
        <rect width="200" height="32" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="url(#glassBorderDark)" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
        <text x="28" y="20" fill="#e2e8f0" class="font-mono" font-size="10.5" font-weight="600">Hostinger • cPanel • DNS Ops</text>
      </g>

      <!-- Pill 6: Verified Proof -->
      <g transform="translate(429, 0)">
        <rect width="138" height="32" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(56, 189, 248, 0.55)" stroke-width="1" />
        <text x="14" y="20" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">PROD VERIFIED ↗</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE HUD MODULE ================= -->
  <g transform="translate(680, 52)">
    <!-- Backdrop Glass Card -->
    <rect width="472" height="278" rx="12" fill="rgba(11, 17, 32, 0.88)" stroke="url(#glassBorderDark)" stroke-width="1.2" />
    
    <!-- HUD Card Header -->
    <rect width="472" height="36" rx="12" fill="rgba(15, 23, 42, 0.95)" />
    <rect y="24" width="472" height="12" fill="rgba(15, 23, 42, 0.95)" />
    <line x1="0" y1="36" x2="472" y2="36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Terminal Indicator Dots -->
    <circle cx="20" cy="18" r="4.5" fill="#f87171" opacity="0.9" />
    <circle cx="35" cy="18" r="4.5" fill="#fbbf24" opacity="0.9" />
    <circle cx="50" cy="18" r="4.5" fill="#34d399" opacity="0.9" />

    <!-- Terminal Title -->
    <text x="70" y="22" fill="#94a3b8" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="0.5">AP_TELEMETRY // LIVE PRODUCTION MATRIX</text>
    <rect x="406" y="10" width="52" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="0.8" />
    <text x="415" y="21.5" fill="#34d399" class="font-mono" font-size="8.5" font-weight="700">LIVE</text>

    <!-- HUD Content Rows -->
    <g transform="translate(20, 52)">

      <!-- ROW 1: Commercial Web Deliveries -->
      <g transform="translate(0, 0)">
        <text x="0" y="11" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">Client Web (Shopify / WP / React)</text>
        <text x="375" y="11" fill="#34d399" class="font-mono" font-size="10" font-weight="700">ACTIVE</text>
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.07)" />
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="url(#emeraldBar)" class="glow-bar" />
      </g>

      <!-- ROW 2: Power BI / SQL Intelligence -->
      <g transform="translate(0, 42)">
        <text x="0" y="11" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">BI Analytics (Blinkit &amp; Amazon Dashboards)</text>
        <text x="366" y="11" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700">138K+ ROWS</text>
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.07)" />
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="url(#cyanBar)" class="glow-bar" />
      </g>

      <!-- ROW 3: Lucidity FinTech Engine -->
      <g transform="translate(0, 84)">
        <text x="0" y="11" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">Lucidity Engine (VaR, Sharpe &amp; Monte Carlo)</text>
        <text x="375" y="11" fill="#fbbf24" class="font-mono" font-size="10" font-weight="700">ACTIVE</text>
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.07)" />
        <rect x="0" y="19" width="395" height="5" rx="2.5" fill="url(#goldBar)" class="glow-bar" />
      </g>

      <!-- ROW 4: Nexus AI Data Cleaning Pipeline -->
      <g transform="translate(0, 126)">
        <text x="0" y="11" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">Nexus AI (Tabular Anomaly &amp; EDA Engine)</text>
        <text x="382" y="11" fill="#a78bfa" class="font-mono" font-size="10" font-weight="700">v2 ACTIVE</text>
        <rect x="0" y="19" width="432" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.07)" />
        <rect x="0" y="19" width="350" height="5" rx="2.5" fill="url(#cyanBar)" class="glow-bar" />
      </g>

      <!-- Animated Waveform & Cycling Terminal Command Feed -->
      <g transform="translate(0, 154)">
        <line x1="0" y1="0" x2="432" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <!-- Waveform EKG / FinTech Volatility Ticker -->
        <path d="M 0 8 L 70 8 L 82 2 L 92 14 L 102 3 L 112 13 L 122 8 L 220 8 L 232 1 L 242 15 L 252 4 L 262 12 L 272 8 L 432 8" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.6" stroke-dasharray="432" class="wave-pulse" />
        
        <g transform="translate(0, 24)">
          <text x="0" y="8" fill="#64748b" class="font-mono" font-size="9" font-weight="700">EXEC &gt;</text>
          <g transform="translate(48, 8)">
            <text fill="#38bdf8" class="font-mono cmd-1" font-size="9" font-weight="600">ap.exec("analyze_risk") // VaR (95%) | Sharpe: 2.14</text>
            <text fill="#34d399" class="font-mono cmd-2" font-size="9" font-weight="600">powerbi.render("blinkit_bi") // 8,500+ orders [OK]</text>
            <text fill="#fbbf24" class="font-mono cmd-3" font-size="9" font-weight="600">sql.query("amazon_sales") // 130k rows partitioned</text>
          </g>
          <text x="395" y="8" fill="#22d3ee" class="font-mono cursor-blink" font-size="10" font-weight="700">_</text>
        </g>
        
        <g transform="translate(0, 44)">
          <text x="0" y="8" fill="#64748b" class="font-mono" font-size="9" font-weight="600">STACK :</text>
          <text x="48" y="8" fill="#38bdf8" class="font-mono" font-size="9" font-weight="600">SQL • Power BI (DAX) • Python • React • Shopify • VPS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
