<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shopifyGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96bf48" />
      <stop offset="100%" stop-color="#212b36" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(6, 182, 212, 0.25)" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-text { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace; }
    .sans-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .pulse { animation: pulse-dot 2.5s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Subtle Grid Texture -->
  <rect width="1200" height="380" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="90" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="290" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="70" r="110" fill="#06b6d4" opacity="0.09" filter="url(#glow)" />

  <!-- Decorative Chart Line Background -->
  <path d="M 50 330 Q 200 300 350 250 T 650 190 T 950 130 T 1150 80" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 50 350 Q 250 315 450 270 T 800 180 T 1150 95" fill="none" stroke="rgba(139, 92, 246, 0.12)" stroke-width="1.5" />

  <!-- LEFT COLUMN: Identity & Bio -->
  <g transform="translate(60, 45)">
    
    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="30" rx="15" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
      <circle cx="15" cy="15" r="4.5" fill="#10b981" class="pulse" filter="url(#softGlow)" />
      <text x="30" y="19.5" fill="#a5f3fc" class="mono-text" font-size="12" font-weight="600" letter-spacing="0.5">FINAL YEAR BBA • DELIVERING LIVE SITES</text>
    </g>

    <!-- Main Title / Name -->
    <text x="0" y="80" fill="#ffffff" class="sans-text" font-size="44" font-weight="800" letter-spacing="-1">
      Agampreet Singh Waan
    </text>

    <!-- Gradient Tagline -->
    <text x="0" y="118" fill="url(#accentCyan)" class="sans-text" font-size="19" font-weight="700" letter-spacing="0.2">
      FinTech Specialist • Web Developer • BI &amp; AI Product Builder
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="150" fill="#94a3b8" class="sans-text" font-size="14.5" font-weight="400">
      Delivering high-performance commercial websites (React, Shopify, WordPress)
    </text>
    <text x="0" y="172" fill="#94a3b8" class="sans-text" font-size="14.5" font-weight="400">
      and end-to-end FinTech, BI dashboards, and AI data systems for live clients.
    </text>

    <!-- Quick Pill Badges (Two Rows) -->
    <g transform="translate(0, 205)">
      <!-- Pill 1: Final Year BBA -->
      <g transform="translate(0, 0)">
        <rect width="160" height="30" rx="8" fill="rgba(251, 191, 36, 0.1)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
        <text x="10" y="19" fill="#fde68a" class="mono-text" font-size="11" font-weight="600">🎓 Final Year BBA FinTech</text>
      </g>
      
      <!-- Pill 2: Web & E-Commerce -->
      <g transform="translate(170, 0)">
        <rect width="185" height="30" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="10" y="19" fill="#6ee7b7" class="mono-text" font-size="11" font-weight="600">🛍️ Shopify • WordPress • React</text>
      </g>

      <!-- Pill 3: Production Deployments -->
      <g transform="translate(365, 0)">
        <rect width="165" height="30" rx="8" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
        <text x="10" y="19" fill="#93c5fd" class="mono-text" font-size="11" font-weight="600">🚀 Hostinger &amp; Live Deploy</text>
      </g>
    </g>

    <g transform="translate(0, 245)">
      <!-- Pill 4: Power BI & DAX -->
      <g transform="translate(0, 0)">
        <rect width="160" height="30" rx="8" fill="rgba(242, 200, 17, 0.1)" stroke="rgba(242, 200, 17, 0.3)" stroke-width="1" />
        <text x="10" y="19" fill="#fef08a" class="mono-text" font-size="11" font-weight="600">📊 Power BI &amp; DAX Analytics</text>
      </g>

      <!-- Pill 5: AI & Quant Models -->
      <g transform="translate(170, 0)">
        <rect width="185" height="30" rx="8" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
        <text x="10" y="19" fill="#c4b5fd" class="mono-text" font-size="11" font-weight="600">🤖 Agentic AI &amp; Quant Models</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interactive Terminal HUD -->
  <g transform="translate(685, 42)">
    <!-- Terminal Box -->
    <rect width="455" height="295" rx="12" fill="#0b1120" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.2" />
    
    <!-- Terminal Header Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 443 0 Q 455 0 455 12 L 455 38 L 0 38 Z" fill="rgba(15, 23, 42, 0.9)" />
    <line x1="0" y1="38" x2="455" y2="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window Dots -->
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    
    <text x="75" y="23" fill="#64748b" class="mono-text" font-size="11.5" font-weight="500">aps-waan@client-production: ~/live-deployments</text>

    <!-- Terminal Content -->
    <g transform="translate(18, 56)">
      <text x="0" y="16" fill="#38bdf8" class="mono-text" font-size="11.5" font-weight="600">$</text>
      <text x="15" y="16" fill="#e2e8f0" class="mono-text" font-size="11.5" font-weight="500">show --status --commercial-projects</text>

      <!-- Row 1: Commercial Web & E-Commerce -->
      <g transform="translate(0, 36)">
        <text x="0" y="0" fill="#f8fafc" class="mono-text" font-size="11.5" font-weight="600">Client Web (Shopify / WP / React)</text>
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="rgba(255, 255, 255, 0.08)" />
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="url(#emeraldGradient)" />
        <text x="325" y="14" fill="#34d399" class="mono-text" font-size="10.5" font-weight="600">LIVE</text>
      </g>

      <!-- Row 2: Nexus v2 -->
      <g transform="translate(0, 72)">
        <text x="0" y="0" fill="#f8fafc" class="mono-text" font-size="11.5" font-weight="600">Nexus v2 [AI Data Analyzer Engine]</text>
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="rgba(255, 255, 255, 0.08)" />
        <rect x="0" y="7" width="125" height="7" rx="3.5" fill="url(#accentCyan)" />
        <text x="325" y="14" fill="#38bdf8" class="mono-text" font-size="10.5" font-weight="600">v2 BETA</text>
      </g>

      <!-- Row 3: Lucidity Quant Engine -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" fill="#f8fafc" class="mono-text" font-size="11.5" font-weight="600">Lucidity [Quant Portfolio &amp; VaR]</text>
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="rgba(255, 255, 255, 0.08)" />
        <rect x="0" y="7" width="280" height="7" rx="3.5" fill="url(#goldGradient)" />
        <text x="325" y="14" fill="#fbbf24" class="mono-text" font-size="10.5" font-weight="600">90%</text>
      </g>

      <!-- Row 4: BI Analytics Dashboards -->
      <g transform="translate(0, 144)">
        <text x="0" y="0" fill="#f8fafc" class="mono-text" font-size="11.5" font-weight="600">Power BI Dashboards (Amazon/Blinkit)</text>
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="rgba(255, 255, 255, 0.08)" />
        <rect x="0" y="7" width="310" height="7" rx="3.5" fill="url(#accentCyan)" />
        <text x="325" y="14" fill="#38bdf8" class="mono-text" font-size="10.5" font-weight="600">PROD</text>
      </g>

      <!-- Row 5: Hostinger / Infrastructure -->
      <g transform="translate(0, 184)">
        <line x1="0" y1="0" x2="415" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="0" y="18" fill="#94a3b8" class="mono-text" font-size="11">🌐 Hostinger • Vercel • Custom Domains • cPanel • DNS</text>
        <text x="0" y="34" fill="#10b981" class="mono-text" font-size="11">✔ Commercial Delivery: Real Client Production Success</text>
      </g>
    </g>
  </g>
</svg>
