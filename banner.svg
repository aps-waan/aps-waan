<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-gradient)" rx="15" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M 0,30 L 1200,30 M 0,60 L 1200,60 M 0,90 L 1200,90 M 0,120 L 1200,120 M 0,150 L 1200,150 M 0,180 L 1200,180 M 0,210 L 1200,210 M 0,240 L 1200,240 M 0,270 L 1200,270" stroke="#ffffff" stroke-width="1" />
    <path d="M 50,0 L 50,300 M 100,0 L 100,300 M 150,0 L 150,300 M 200,0 L 200,300 M 250,0 L 250,300 M 300,0 L 300,300 M 350,0 L 350,300 M 400,0 L 400,300 M 450,0 L 450,300 M 500,0 L 500,300 M 550,0 L 550,300 M 600,0 L 600,300 M 650,0 L 650,300 M 700,0 L 700,300 M 750,0 L 750,300 M 800,0 L 800,300 M 850,0 L 850,300 M 900,0 L 900,300 M 950,0 L 950,300 M 1000,0 L 1000,300 M 1050,0 L 1050,300 M 1100,0 L 1100,300 M 1150,0 L 1150,300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Ambient decorative glow shapes in background -->
  <circle cx="1100" cy="80" r="100" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="220" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="150" r="80" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Abstract Geometry representing Data/Connections -->
  <g stroke="url(#cyan-blue)" stroke-width="1.5" opacity="0.25">
    <line x1="850" y1="50" x2="950" y2="100" />
    <line x1="950" y1="100" x2="900" y2="200" />
    <line x1="900" y1="200" x2="1050" y2="150" />
    <line x1="1050" y1="150" x2="1120" y2="250" />
    <line x1="950" y1="100" x2="1050" y2="150" stroke="url(#purple-pink)" />
  </g>
  <g fill="url(#cyan-blue)" opacity="0.6">
    <circle cx="850" cy="50" r="4" />
    <circle cx="950" cy="100" r="6" />
    <circle cx="900" cy="200" r="5" />
    <circle cx="1050" cy="150" r="7" />
    <circle cx="1120" cy="250" r="4" />
  </g>

  <!-- Title Text -->
  <text x="80" y="125" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="1">
    AGAMPREET WAAN
  </text>

  <!-- Subtitle Tagline -->
  <text x="82" y="175" fill="url(#primary-grad)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="1.5">
    BUILDING AI, DATA ANALYTICS &amp; FINTECH PRODUCTS
  </text>

  <!-- Focus Badges (SVG represented) -->
  <g transform="translate(82, 215)">
    <!-- Badge 1: AI & Agents -->
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="15" r="5" fill="#06b6d4" />
    <text x="30" y="20" fill="#94a3b8" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="12">AI &amp; Agents</text>

    <!-- Badge 2: Data Analytics -->
    <rect x="145" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="160" cy="15" r="5" fill="#3b82f6" />
    <text x="175" y="20" fill="#94a3b8" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="12">Data Analytics</text>

    <!-- Badge 3: FinTech -->
    <rect x="305" y="0" width="110" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="320" cy="15" r="5" fill="#ec4899" />
    <text x="335" y="20" fill="#94a3b8" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="12">FinTech</text>
  </g>
</svg>
